  <text x="200" y="288.8" text-anchor="middle" font-family="Oswald, Impact, Haettenschweiler, 'Arial Narrow', sans-serif" font-weight="700" font-size="27.3" letter-spacing="3" fill="#f3e6c8">KINDNESS AGENT</text>
